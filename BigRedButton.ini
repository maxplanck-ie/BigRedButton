[Paths]
#Where full/partial flowcell demultiplexing results are stored. Copies of parts of this are delivered to groups
baseData=/path/to/dissectBCL_results
# groupdata = /path if PI A and pi B have folders as /path/A/sequencing_data and /path/B/sequencing_data
groupData=/path/to/basedir/of/PI/folders
# where sequencing facility inspects QC reports
seqFacDir=/path/to/seqfacdir
# where the log-files show appear
logPath=/path/to/logdir

#Groups are stored under $groupData/groupName
groupData=/data
bioinfoCoreDir=/path/to/bioinfocoreDir

[Options]
#How long to sleep between runs, in hours, may be fractional
sleepTime=1
#valid library types, separate by a comma
validLibraryTypes=ChIP-Seq,stranded mRNA-Seq,stranded RNA-Seq,mRNA-Seq,RNA-Seq,WGS,ATAC-Seq
#Pipeline names, one for each of the aforementioned validLibraryTypes. Each pipeline is actually a function in the PushButton submodule
pipelines=DNA,RNA,RNA,RNA,RNA,DNA,ATAC
#valid organisms, separate by a comma
validOrganisms=human,mouse,drosophila
#An ordered list of the organism names used in the pipeline (the order matches validOrganisms)
organismNames=hg38,mm10,dm6
#Snakemake workflow base directory
snakemakeWorkflowBaseDir=/path/anaconda3/envs/snakePipes-V.x.y/
# How many library-groups to dispatch concurrently per flowcell. Each one is a
# local snakePipes driver; RELACS groups additionally fan out to 10 local
# demultiplex_relacs processes. When BigRedButton is started with -s/--sequencer,
# two processes share this host and each takes half of this value (minimum 1).
poolSize=2
# Path to the scancel binary used to cancel a crashed flowcell's Slurm jobs.
# Defaults to "scancel" (resolved off PATH). On hosts where Slurm's client
# binaries only appear on PATH after `module load slurm` (rapidus, at
# least), run_brb won't see them: set this to the absolute path scancel
# resolves to after that module load (e.g. `which scancel` in that shell).
scancelBin=scancel
#Don't set these, they're just for passing info around
runID=

[Queue]
queueName=queue_name
parallelProcesses=10

[Parkour]
QueryURL=http://someserver.com/api/analysis_list/analysis_list/
ResultsURL=
user=foo@bar.com
password=supersecret
cert=path/to/cert.pem

[Email]
#Lists of recipients can be comma separated
errorTo=mustermann@ie-freiburg.mpg.de
finishedTo=mustermann@ie-freiburg.mpg.de
deepSeq=mustermann@ie-freiburg.mpg.de, another.example@ie-freiburg.mpg.de
fromAddress=some.user@ie-freiburg.mpg.de
host=localhost

[Galaxy]
URL=URL_to_galaxy_server
API key=the_api_key
verify=False
Users=path_to_user_file

[10x]
# separate pipelines specific for 10x Single Cell processing
RNA=/path/to/repo/10X_snakepipe/10x_scRNA/10x_scRNA
ATAC=/path/to/repo/10X_snakepipe/10x_scATAC/10x_scATAC


[external]
# Projects that don't belong to any PI/group under $groupData (e.g. external
# collaborators) are skipped by default, regardless of library type. The two
# settings below opt specific libraries back in for processing anyway; their
# output goes under $baseData/<runID>/Analysis_<project>/ instead of a PI's
# groupData tree, since there's no group directory to put it in.
#
# Library types (comma separated) that should still be processed for
# external projects. Matched against the Parkour "library type" field (see
# validLibraryTypes above).
LibraryTypes =
# Library protocols (comma separated) that should still be processed for
# external projects, matched via startswith() against the Parkour "library
# protocol" field. Use this for protocol-specific opt-ins (e.g. "ChIP RELACS
# high-throughput") without opening up every library of that type to
# external processing.
LibraryProtocols =
# Where BRB fexsends the final results tarball for external projects
# processed via LibraryTypes/LibraryProtocols above (currently only used by
# the RELACS pipeline).
fexRecipient = mustermann@ie-freiburg.mpg.de
# Path to the fexsend binary used for the above.
fexsendBin = ~/.local/bin/fexsend
